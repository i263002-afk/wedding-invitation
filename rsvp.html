<h1>RSVP for the Wedding</h1>
<p>Please let us know if you will be joining us on our special day!</p>

<img src="image_folder/image.jpg" alt="Wedding Venue Decor" width="750" height="333">

<br><br>

<form onsubmit="event.preventDefault(); submitRSVP();">
  <label for="fullname">Full Name:</label><br>
  <input type="text" id="fullname" name="fullname" required><br><br>

  <label for="guests">Number of Guests:</label><br>
  <input type="number" id="guests" name="guests" min="1" value="1" required><br><br>

  <button type="submit">Submit RSVP</button>
</form>

<p id="demo"></p>

<script>
  function submitRSVP() {
    console.log("RSVP submitted");
    window.alert("Thank you for your RSVP!");
  }
</script>
